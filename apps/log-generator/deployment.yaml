apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-generator
  namespace: stars

spec:
  replicas: 1

  selector:
    matchLabels:
      app: log-generator

  template:
    metadata:
      labels:
        app: log-generator

    spec:
      terminationGracePeriodSeconds: 5

      containers:
        - name: log-generator
          image: busybox:1.36

          # Probe succeeds once the startup event has been written.
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test -f /tmp/stars-started
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30

          # Only Ready after the ready event and trigger setup are complete.
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test -f /tmp/stars-ready && test -x /tmp/stars-trigger
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 1

          env:
            - name: AUTO_SPIKE
              value: "false"

          command:
            - /bin/sh
            - -c

          args:
            - |
              set -eu
              AUTO_SPIKE_PID=
              STARTUP_RUN_ID="startup-$(date -u '+%Y%m%dT%H%M%SZ')-$$$"
              rm -f /tmp/stars-started /tmp/stars-ready
              printf '%s level=INFO service=log-generator event=startup message="Process started" run_id=%s\n' \
                "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "$STARTUP_RUN_ID"
              touch /tmp/stars-started
              cleanup() {
                rm -f /tmp/stars-started /tmp/stars-ready
                if [ -n "$AUTO_SPIKE_PID" ]; then
                  kill "$AUTO_SPIKE_PID" 2>/dev/null || true
                  wait "$AUTO_SPIKE_PID" 2>/dev/null || true
                fi
              }
              trap 'exit 0' TERM INT
              trap cleanup EXIT
              CONTROL_DIR=/tmp/stars-control
              export CONTROL_DIR
              mkdir -p "$CONTROL_DIR"
              # Requests are ephemeral. No incident automatically repeats after restart.
              rm -f "$CONTROL_DIR"/*.ready "$CONTROL_DIR"/request.*
              cat > /tmp/stars-trigger <<'TRIGGER'
              #!/bin/sh
              set -eu
              if [ "$#" -ne 2 ]; then
                echo "Usage: /tmp/stars-trigger warn|error|error-spike|connectivity|crash RUN_ID" >&2
                exit 2
              fi
              case "$1" in warn|error|error-spike|connectivity|crash) ;; *) echo 'Unknown scenario' >&2; exit 2;; esac
              case "$2" in ''|*[!A-Za-z0-9_-]*) echo 'RUN_ID must use letters, digits, underscores or hyphens' >&2; exit 2;; esac
              [ "${#2}" -le 64 ] || { echo 'RUN_ID must be at most 64 characters' >&2; exit 2; }
              CONTROL_DIR=/tmp/stars-control
              request=$(mktemp "$CONTROL_DIR/request.XXXXXX")
              trap 'rm -f "$request"' EXIT
              printf '%s %s\n' "$1" "$2" > "$request"
              # Atomic publication: PID 1 never reads a partially written command.
              mv "$request" "$request.ready"
              printf 'Queued scenario=%s run_id=%s\n' "$1" "$2"
              TRIGGER
              chmod 700 /tmp/stars-trigger

              log() {
                printf '%s level=%s service=log-generator scenario=%s run_id=%s message="%s"\n' \
                  "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "$1" "$2" "$3" "$4"
              }

              # Automatic spikes run separately, so manual scenarios remain responsive.
              auto_spike() {
                SPIKE=1
                while true; do
                  AUTO_RUN_ID="auto-$(date -u '+%Y%m%dT%H%M%SZ')-$SPIKE"
                  i=1
                  while [ "$i" -le 20 ]; do
                    case $((i % 5)) in
                      1)
                        TYPE="authentication"
                        MESSAGE="authentication failure user_id=test-user reason=invalid_token"
                        ;;
                      2)
                        TYPE="database"
                        MESSAGE="database timeout database=stars-db timeout_ms=5000"
                        ;;
                      3)
                        TYPE="connectivity"
                        MESSAGE="connection failure target=stars-api:8080 reason=connection_refused"
                        ;;
                      4)
                        TYPE="dependency"
                        MESSAGE="dependency failure service=payment-api reason=unavailable"
                        ;;
                      0)
                        TYPE="service"
                        MESSAGE="service unavailable service=stars-api status=503"
                        ;;
                    esac
                    printf '%s level=ERROR service=log-generator scenario=%s spike=true run_id=%s error_index=%s message="%s"\n' \
                      "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "$TYPE" "$AUTO_RUN_ID" "$i" "$MESSAGE"
                    i=$((i + 1))
                  done
                  SPIKE=$((SPIKE + 1))
                  sleep 20
                done
              }

              if [ "${AUTO_SPIKE:-false}" = "true" ]; then
                auto_spike &
                AUTO_SPIKE_PID=$!
                log INFO startup "$STARTUP_RUN_ID" 'Automatic error spikes enabled'
              else
                log INFO startup "$STARTUP_RUN_ID" 'Automatic error spikes disabled'
              fi

              printf '%s level=INFO service=log-generator event=ready message="Ready to serve" run_id=%s\n' \
                "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "$STARTUP_RUN_ID"
              touch /tmp/stars-ready

              COUNT=1
              NEXT_HEARTBEAT=0
              while true; do
                NOW=$(date +%s)
                if [ "$NOW" -ge "$NEXT_HEARTBEAT" ]; then
                  printf '%s level=INFO service=log-generator message="STARS heartbeat" run_id=%s count=%s\n' \
                    "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "$STARTUP_RUN_ID" "$COUNT"
                  COUNT=$((COUNT + 1))
                  NEXT_HEARTBEAT=$((NOW + 5))
                fi
                # Process at most one request per tick, keeping heartbeat checks responsive.
                for request in "$CONTROL_DIR"/*.ready; do
                  [ -f "$request" ] || continue
                  read -r SCENARIO RUN_ID < "$request"
                  rm -f "$request"
                  log INFO "$SCENARIO" "$RUN_ID" 'Scenario started'
                  case "$SCENARIO" in
                    warn) log WARN "$SCENARIO" "$RUN_ID" 'On-demand warning; synthetic degraded condition' ;;
                    error) log ERROR "$SCENARIO" "$RUN_ID" 'On-demand error; synthetic application failure' ;;
                    error-spike)
                      N=1
                      while [ "$N" -le 20 ]; do
                        log ERROR "$SCENARIO" "$RUN_ID" "Injected application error $N of 20"
                        N=$((N + 1))
                      done
                      ;;
                    connectivity)
                      # Closed loopback port in this single-container pod: no external target.
                      if wget -q -T 2 -O /dev/null http://127.0.0.1:1/ 2>/dev/null; then
                        log WARN "$SCENARIO" "$RUN_ID" 'Unexpected HTTP success; connectivity test invalid'
                      else
                        RC=$?
                        log ERROR "$SCENARIO" "$RUN_ID" "Controlled connection failure target=127.0.0.1:1 wget_exit=$RC"
                      fi
                      ;;
                    crash)
                      log ERROR "$SCENARIO" "$RUN_ID" 'Injected container crash; exiting with code 42'
                      exit 42
                      ;;
                  esac
                  log INFO "$SCENARIO" "$RUN_ID" 'Scenario completed'
                  break
                done
                sleep 1 &
                wait $!
              done
