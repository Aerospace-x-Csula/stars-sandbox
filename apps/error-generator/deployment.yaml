apiVersion: apps/v1                         # Kubernetes API version
kind: Deployment                            # Create a Kubernetes Deployment

metadata:
  name: error-generator                     # Deployment name
  namespace: stars                          # Put the Deployment in the "stars" namespace

spec:
  replicas: 1                               # Run 1 error-generator Pod

  selector:
    matchLabels:
      app: error-generator                  # Deployment manages Pods with this label

  template:
    metadata:
      labels:
        app: error-generator                # Label given to the Pod

    spec:
      containers:
        - name: error-generator             # Container name
          image: busybox:1.36               # Small Linux image with shell commands

          command:
            - /bin/sh                       # Start Linux shell
            - -c                            # Run the following block as a shell command
            - |
              SPIKE=1                       # Keep track of each spike

              while true; do                # Repeat forever

                i=1                         # Start at error number 1

                while [ "$i" -le 20 ]; do   # Generate 20 ERROR logs in one spike

                  case $((i % 5)) in         # Rotate between 5 different error types

                    1)
                      TYPE="authentication"  # Authentication failure
                      MESSAGE="authentication failure user_id=test-user reason=invalid_token"
                      ;;

                    2)
                      TYPE="database"        # Database timeout
                      MESSAGE="database timeout database=stars-db timeout_ms=5000"
                      ;;

                    3)
                      TYPE="connectivity"    # Network/connectivity failure
                      MESSAGE="connection failure target=stars-api:8080 reason=connection_refused"
                      ;;

                    4)
                      TYPE="dependency"      # Dependency failure
                      MESSAGE="dependency failure service=payment-api reason=unavailable"
                      ;;

                    0)
                      TYPE="service"         # Service unavailable
                      MESSAGE="service unavailable service=stars-api status=503"
                      ;;

                  esac

                  echo "$(date -u '+%Y-%m-%dT%H:%M:%SZ') level=ERROR service=error-generator scenario=$TYPE spike=true spike_id=spike$SPIKE error_index=$i message=\"$MESSAGE\""
                                             # Print one structured ERROR log

                  i=$((i + 1))               # Move to the next ERROR

                done

                SPIKE=$((SPIKE + 1))         # Increase spike number

                sleep 20                     # Wait 20 seconds before next spike

              done