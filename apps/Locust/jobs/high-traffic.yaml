# Headless (no UI) run: high-traffic. Edit users (-u), ramp up (-r) and run time (-t) below.
apiVersion: batch/v1
kind: Job
metadata:
  name: locust-high-traffic
  namespace: stars
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: locust-job
        scenario: high-traffic
    spec:
      restartPolicy: Never
      containers:
        - name: locust
          image: locustio/locust:2.32.0   # keep in sync with k8s/locust.yaml
          args:
            - "-f"
            - "/mnt/locust/locustfile.py"
            - "--headless"
            - "--host"
            - "http://stars-app.stars.svc.cluster.local"
            - "--scenario"
            - "high-traffic"
            - "-u"
            - "200"
            - "-r"
            - "20"
            - "-t"
            - "5m"
            - "HighTrafficUser"
          env:
            - name: O2_URL
              valueFrom:
                secretKeyRef: { name: openobserve-credentials, key: url, optional: true }
            - name: O2_USER
              valueFrom:
                secretKeyRef: { name: openobserve-credentials, key: user, optional: true }
            - name: O2_PASSWORD
              valueFrom:
                secretKeyRef: { name: openobserve-credentials, key: password, optional: true }
          volumeMounts:
            - name: locustfile
              mountPath: /mnt/locust
      volumes:
        - name: locustfile
          configMap:
            name: locustfile
